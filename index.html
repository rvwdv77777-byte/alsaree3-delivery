<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ع السريع - طلب المنتجات والأكل في صان الحجر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* تصميم اللوجو مع تأثير البرق */
        .logo-box {
            background: linear-gradient(135deg, #1a1a1a 0%, #2c2c2c 100%);
            border: 3px solid #ffcc00;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.35);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .logo-box:hover {
            transform: scale(1.03);
        }
        /* أيقونة البرق */
        .lightning-icon {
            font-size: 32px;
            color: #ffcc00;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 8px rgba(255, 204, 0, 0.6));
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .logo-title {
            color: #ffcc00;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: -1px;
        }
        .logo-sub {
            color: #e0e0e0;
            font-size: 10px;
            margin-top: 3px;
            padding: 0 10px;
        }
        /* العنوان التوضيحي تحت اللوجو */
        .tagline {
            color: #ffcc00;
            font-size: 17px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        /* شريط البحث عن المنتجات */
        .search-box {
            background-color: #ffffff;
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 8px 10px 8px 15px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: box-shadow 0.3s ease;
        }
        .search-box:focus-within {
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.4);
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            text-align: right;
            padding: 5px;
            color: #333;
            background: transparent;
        }
        .search-box input::placeholder {
            color: #888;
        }
        .search-btn {
            background-color: #ffcc00;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #121212;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .search-btn:hover {
            background-color: #e6b800;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- دائرة الشعار مع رمز البرق -->
        <div class="logo-box">
            <div class="lightning-icon">⚡</div>
            <div class="logo-title">ع السريع</div>
            <div class="logo-sub">توصيل كافة الطلبات في صان الحجر</div>
        </div>

        <!-- النص التوضيحي -->
        <div class="tagline">اطلب أكل، منتجات، وكل ما تحتاجه في صان الحجر</div>

        <!-- شريط البحث عن المنتجات -->
        <div class="search-box">
            <button class="search-btn" id="searchBtn" title="بحث">←</button>
            <input type="text" id="productInput" placeholder="ابحث عن أكلة، منتج، أو طلب معين...">
        </div>
    </div>

    <script>
        // تفاعل زر البحث وإدخال اسم المنتجات
        const searchBtn = document.getElementById('searchBtn');
        const productInput = document.getElementById('productInput');

        function handleSearch() {
            const query = productInput.value.trim();
            if (query) {
                alert(`جاري البحث عن المنتج: ${query} في صان الحجر`);
            } else {
                alert('الرجاء كتابة اسم المنتج أو الطلب الذي تبحث عنه أولاً.');
                productInput.focus();
            }
        }

        searchBtn.addEventListener('click', handleSearch);
        
        productInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>

</body>
</html>
